# Runs on every push and pull request to this fork.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx eslint .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GJS and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs dbus
      - name: Unit tests
        # The agent client tests own a fake agent on a private session bus.
        run: GIO_USE_VFS=local dbus-run-session -- gjs -m tests/run.js
      - name: Settings schema compiles
        run: glib-compile-schemas --strict --dry-run schemas

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: metadata.json names the shipped schema
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          m = json.load(open('metadata.json'))
          schema = m['settings-schema']
          if m['uuid'] != 'spotlight@genolabs.net':
              sys.exit(f"unexpected uuid {m['uuid']}")
          if not schema.startswith('org.gnome.shell.extensions.'):
              sys.exit(f'schema {schema} must live under org.gnome.shell.extensions')
          if not pathlib.Path(f'schemas/{schema}.gschema.xml').is_file():
              sys.exit(f'schemas/{schema}.gschema.xml is missing')
          print(f"metadata OK: {m['uuid']} {m['version-name']}")
          PY
      - name: Process isolation
        # GNOME Shell code must never load GTK; preferences must never load Shell libraries.
        run: |
          shell_js=$(git ls-files '*.js' | grep -v -e '^prefs' -e '^tests/' -e '^eslint.config.js')
          if grep -n "from 'gi://Gtk'\|from 'gi://Gdk'\|from 'gi://Adw'" $shell_js; then
            echo "ERROR: shell files import GTK libraries"; exit 1; fi
          if grep -n "from 'gi://St'\|from 'gi://Clutter'\|from 'gi://Meta'\|from 'gi://Shell'" prefs.js prefs/*.js; then
            echo "ERROR: prefs files import shell libraries"; exit 1; fi
      - name: No deprecated imports
        run: |
          if git grep -n "imports\.misc\.\|imports\.ui\." -- '*.js'; then
            echo "ERROR: deprecated imports"; exit 1; fi
      - name: CSS uses only /* */ comments
        run: |
          if grep -n '^\s*//' stylesheet.css; then
            echo "ERROR: CSS uses // comments"; exit 1; fi
      - name: ShellCheck
        run: shellcheck tests/smoke/run.sh
